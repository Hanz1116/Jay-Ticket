name: Ticketmaster Monitor

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          pip3 install playwright anthropic requests --quiet
          playwright install chromium --with-deps --quiet

      - name: Check ticket availability via Claude Vision
        shell: python3 {0}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          import base64, logging, os, sys, time
          import anthropic, requests
          from playwright.sync_api import sync_playwright

          EVENT_URL       = "https://www.ticketmaster.com/event/2500647FEE7EB74F"
          TARGET_SECTIONS = ["A3", "A4", "A5", "A6", "A7", "A8"]

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s  %(levelname)-8s  %(message)s",
              datefmt="%Y-%m-%d %H:%M:%S",
              handlers=[logging.StreamHandler(sys.stdout)],
          )
          log = logging.getLogger(__name__)

          anthropic_key = os.environ.get("ANTHROPIC_API_KEY", "").strip()
          ntfy_topic    = os.environ.get("NTFY_TOPIC", "").strip()

          if not anthropic_key or not ntfy_topic:
              log.error("ANTHROPIC_API_KEY and NTFY_TOPIC must be set as GitHub Secrets.")
              sys.exit(1)

          # ── Step 1: load Ticketmaster in a real browser and screenshot ────────
          log.info("Opening Ticketmaster event page …")
          screenshot = None
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage"])
                  ctx = browser.new_context(
                      user_agent="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1",
                      viewport={"width": 390, "height": 844},
                  )
                  page = ctx.new_page()
                  page.goto(EVENT_URL, wait_until="networkidle", timeout=30000)
                  time.sleep(5)   # let seatmap finish rendering
                  screenshot = page.screenshot()
                  browser.close()
              log.info("Screenshot captured (%d bytes).", len(screenshot))
          except Exception as exc:
              log.error("Browser error: %s", exc)
              sys.exit(1)

          # ── Step 2: ask Claude to read the seatmap ────────────────────────────
          log.info("Sending screenshot to Claude Vision …")
          try:
              client  = anthropic.Anthropic(api_key=anthropic_key)
              message = client.messages.create(
                  model="claude-haiku-4-5-20251001",
                  max_tokens=200,
                  messages=[{
                      "role": "user",
                      "content": [
                          {
                              "type": "image",
                              "source": {
                                  "type": "base64",
                                  "media_type": "image/png",
                                  "data": base64.standard_b64encode(screenshot).decode(),
                              },
                          },
                          {
                              "type": "text",
                              "text": (
                                  "This is a Ticketmaster event page or seatmap. "
                                  f"Tell me which of these sections are available for purchase: {', '.join(TARGET_SECTIONS)}. "
                                  "Available sections are shown in colour (blue, green, orange, etc.). "
                                  "Unavailable/sold-out sections are grey. "
                                  "Reply with ONLY one of these exact formats:\n"
                                  "AVAILABLE: A3, A5\n"
                                  "NONE\n"
                                  "UNKNOWN (only if the seatmap is not visible at all)"
                              ),
                          },
                      ],
                  }],
              )
              result = message.content[0].text.strip()
              log.info("Claude says: %s", result)
          except Exception as exc:
              log.error("Claude API error: %s", exc)
              sys.exit(1)

          # ── Step 3: notify if sections are available ──────────────────────────
          if result.startswith("AVAILABLE:"):
              sections = result.replace("AVAILABLE:", "").strip()
              log.info("ALERT — sections available: %s", sections)
              try:
                  r = requests.post(
                      f"https://ntfy.sh/{ntfy_topic}",
                      data=f"Sections available: {sections}".encode(),
                      headers={
                          "Title":    "Tickets Available!",
                          "Priority": "urgent",
                          "Tags":     "rotating_light,ticket",
                      },
                      timeout=10,
                  )
                  r.raise_for_status()
                  log.info("Phone notification sent.")
              except Exception as exc:
                  log.error("ntfy failed: %s", exc)
          elif result == "NONE":
              log.info("No target sections available.")
          else:
              log.warning("Could not read seatmap — Ticketmaster may have shown a bot-check page.")
