name: Ticketmaster Monitor

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: pip3 install requests -q

      - name: Check ticket availability
        shell: python3 {0}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          import logging, os, sys
          import requests

          EVENT_ID        = "2500647FEE7EB74F"
          TARGET_SECTIONS = {"A3", "A4", "A5", "A6", "A7", "A8"}

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s  %(levelname)-8s  %(message)s",
              datefmt="%Y-%m-%d %H:%M:%S",
              handlers=[logging.StreamHandler(sys.stdout)],
          )
          log = logging.getLogger(__name__)

          ntfy_topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not ntfy_topic:
              log.error("NTFY_TOPIC must be set as a GitHub Secret.")
              sys.exit(1)

          QUICKPICKS_URL = (
              f"https://www.ticketmaster.com.au/api/quickpicks/{EVENT_ID}/list"
              "?sort=price&offset=0&qty=1&primary=true&resale=false"
              "&tids=000000000001%2C00020D800001%2C00020E000001%2C00000E010008"
              "&resaleProvider=INTL"
          )
          HEADERS = {
              "User-Agent":  "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15",
              "Accept":      "application/json",
              "Referer":     "https://www.ticketmaster.com.au/",
          }

          log.info("Checking quickpicks API …")
          try:
              r = requests.get(QUICKPICKS_URL, headers=HEADERS, timeout=15)
              r.raise_for_status()
              data = r.json()
          except Exception as exc:
              log.error("API error: %s", exc)
              sys.exit(1)

          all_sections = {pick["section"] for pick in data.get("picks", [])}
          found        = sorted(all_sections & TARGET_SECTIONS)
          total_picks  = data.get("total", 0)

          log.info("Total available picks: %d", total_picks)
          log.info("All available sections: %s", ", ".join(sorted(all_sections)) or "none")
          log.info("Target sections found:  %s", ", ".join(found) or "none")

          if found:
              msg = f"Sections available: {', '.join(found)}"
              log.info("ALERT — %s", msg)
              try:
                  r = requests.post(
                      f"https://ntfy.sh/{ntfy_topic}",
                      data=msg.encode(),
                      headers={
                          "Title":    "Jay Chou Tickets Available!",
                          "Priority": "urgent",
                          "Tags":     "rotating_light,ticket",
                      },
                      timeout=10,
                  )
                  r.raise_for_status()
                  log.info("Phone notification sent.")
              except Exception as exc:
                  log.error("ntfy failed: %s", exc)
