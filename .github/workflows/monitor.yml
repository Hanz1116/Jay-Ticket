name: Ticketmaster Monitor

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: pip3 install requests -q

      - name: Check ticket availability
        shell: python3 {0}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          import logging, os, sys
          import requests

          EVENT_ID        = "2500647FEE7EB74F"
          TARGET_SECTIONS = {"A3", "A4", "A5", "A6", "A7", "A8"}

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s  %(levelname)-8s  %(message)s",
              datefmt="%Y-%m-%d %H:%M:%S",
              handlers=[logging.StreamHandler(sys.stdout)],
          )
          log = logging.getLogger(__name__)

          ntfy_topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not ntfy_topic:
              log.error("NTFY_TOPIC must be set as a GitHub Secret.")
              sys.exit(1)

          MANIFEST_URL = f"https://pubapi.ticketmaster.com/sdk/static/manifest/v1/{EVENT_ID}"

          log.info("Checking pubapi manifest (no auth required) …")
          try:
              r = requests.get(MANIFEST_URL, timeout=15)
              r.raise_for_status()
              data = r.json()
          except Exception as exc:
              log.error("API error: %s", exc)
              sys.exit(1)

          place_ids    = data.get("placeIds", [])
          update_time  = data.get("updateTime", "unknown")
          log.info("Manifest fetched — %d available place IDs (updated %s)", len(place_ids), update_time)
          log.info("Sample place IDs: %s", place_ids[:5])

          # TODO: map place IDs to section names once we know the mapping
          # For now log all data so we can identify A3-A8 place ID patterns
          found = []

          if found:
              msg = f"Sections available: {', '.join(found)}"
              log.info("ALERT — %s", msg)
              try:
                  r = requests.post(
                      f"https://ntfy.sh/{ntfy_topic}",
                      data=msg.encode(),
                      headers={
                          "Title":    "Jay Chou Tickets Available!",
                          "Priority": "urgent",
                          "Tags":     "rotating_light,ticket",
                      },
                      timeout=10,
                  )
                  r.raise_for_status()
                  log.info("Phone notification sent.")
              except Exception as exc:
                  log.error("ntfy failed: %s", exc)
