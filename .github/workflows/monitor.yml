name: Ticketmaster Monitor

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          pip3 install playwright requests -q
          playwright install chromium --with-deps

      - name: Check ticket availability
        shell: python3 {0}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          import json, logging, os, sys, time
          import requests
          from playwright.sync_api import sync_playwright

          EVENT_URL       = "https://www.ticketmaster.com.au/jay-chou-carnival-ii-world-tour-in-melbourne-docklands-17-10-2026/event/2500647FEE7EB74F"
          TARGET_SECTIONS = {"A3", "A4", "A5", "A6", "A7", "A8"}

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s  %(levelname)-8s  %(message)s",
              datefmt="%Y-%m-%d %H:%M:%S",
              handlers=[logging.StreamHandler(sys.stdout)],
          )
          log = logging.getLogger(__name__)

          ntfy_topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not ntfy_topic:
              log.error("NTFY_TOPIC must be set as a GitHub Secret.")
              sys.exit(1)

          # ── Intercept every JSON response the page makes ──────────────────────
          captured = []

          def on_response(response):
              ct = response.headers.get("content-type", "")
              if "json" not in ct:
                  return
              try:
                  captured.append(response.json())
              except Exception:
                  pass

          log.info("Loading Ticketmaster page …")
          found = set()

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage"])
                  ctx = browser.new_context(
                      user_agent=(
                          "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) "
                          "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                          "Version/17.0 Mobile/15E148 Safari/604.1"
                      ),
                      viewport={"width": 390, "height": 844},
                      locale="en-AU",
                  )
                  page = ctx.new_page()
                  page.on("response", on_response)
                  page.goto(EVENT_URL, wait_until="networkidle", timeout=40000)
                  time.sleep(6)   # let seatmap finish loading

                  # ── Method 1: scan intercepted JSON for section availability ──
                  raw = json.dumps(captured)
                  for section in TARGET_SECTIONS:
                      # sections appear as "section":"A3" or "sectionName":"A3" etc.
                      if f'"{section}"' in raw or f"'{section}'" in raw:
                          found.add(section)

                  # ── Method 2: query the live DOM via JavaScript ───────────────
                  dom_found = page.evaluate("""
                  (targets) => {
                      const found = [];
                      targets.forEach(sec => {
                          // Try every common attribute pattern Ticketmaster uses
                          const selectors = [
                              `[id="${sec}"]`,
                              `[data-section="${sec}"]`,
                              `[aria-label*="${sec}"]`,
                              `[data-name="${sec}"]`,
                              `[title="${sec}"]`,
                              `[data-section-name="${sec}"]`,
                          ];
                          for (const sel of selectors) {
                              const els = [...document.querySelectorAll(sel)];
                              for (const el of els) {
                                  const cls  = (el.className || '').toString().toLowerCase();
                                  const disabled = el.getAttribute('aria-disabled') === 'true'
                                      || cls.includes('sold')
                                      || cls.includes('unavailable')
                                      || cls.includes('disabled');
                                  if (!disabled) { found.push(sec); break; }
                              }
                          }
                      });
                      return [...new Set(found)];
                  }
                  """, list(TARGET_SECTIONS))

                  for s in dom_found:
                      found.add(s)

                  log.info("Page title: %s", page.title())
                  log.info("JSON blobs captured: %d", len(captured))
                  log.info("DOM sections found: %s", dom_found)

                  browser.close()

          except Exception as exc:
              log.error("Browser error: %s", exc)
              sys.exit(1)

          # ── Notify ────────────────────────────────────────────────────────────
          found = sorted(found)
          if found:
              msg = f"Sections available: {', '.join(found)}"
              log.info("ALERT — %s", msg)
              try:
                  r = requests.post(
                      f"https://ntfy.sh/{ntfy_topic}",
                      data=msg.encode(),
                      headers={
                          "Title":    "Jay Chou Tickets Available!",
                          "Priority": "urgent",
                          "Tags":     "rotating_light,ticket",
                      },
                      timeout=10,
                  )
                  r.raise_for_status()
                  log.info("Phone notification sent.")
              except Exception as exc:
                  log.error("ntfy failed: %s", exc)
          else:
              log.info("No target sections available (A3–A8).")
