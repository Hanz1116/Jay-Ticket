name: Ticketmaster Monitor

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: pip3 install requests -q

      - name: Check ticket availability
        shell: python3 {0}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          import logging, os, sys
          import requests

          EVENT_ID = "2500647FEE7EB74F"
          SECTIONS = {
              "A3": "IEZQ",
              "A4": "IE2A",
              "A5": "IE2Q",
              "A6": "IE3A",
              "A7": "IE3Q",
              "A8": "IE4A",
          }

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s  %(levelname)-8s  %(message)s",
              datefmt="%Y-%m-%d %H:%M:%S",
              handlers=[logging.StreamHandler(sys.stdout)],
          )
          log = logging.getLogger(__name__)

          ntfy_topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not ntfy_topic:
              log.error("NTFY_TOPIC must be set as a GitHub Secret.")
              sys.exit(1)

          # ── Fetch manifest (public, no auth needed) ───────────────────────────
          log.info("Fetching availability manifest …")
          try:
              r = requests.get(
                  f"https://pubapi.ticketmaster.com/sdk/static/manifest/v1/{EVENT_ID}",
                  timeout=15,
              )
              r.raise_for_status()
              place_ids = set(r.json().get("placeIds", []))
          except Exception as exc:
              log.error("Failed to fetch manifest: %s", exc)
              sys.exit(1)

          log.info("Available place IDs in manifest: %d", len(place_ids))

          # ── Check which target sections have available seats ───────────────────
          found = [
              section for section, prefix in SECTIONS.items()
              if any(pid.startswith(prefix) for pid in place_ids)
          ]

          log.info("Target sections available: %s", ", ".join(found) or "none")

          # ── Notify ────────────────────────────────────────────────────────────
          if found:
              msg = f"Sections available: {', '.join(found)}"
              log.info("ALERT — %s", msg)
              try:
                  r = requests.post(
                      f"https://ntfy.sh/{ntfy_topic}",
                      data=msg.encode(),
                      headers={
                          "Title":    "Jay Chou Tickets Available!",
                          "Priority": "urgent",
                          "Tags":     "rotating_light,ticket",
                      },
                      timeout=10,
                  )
                  r.raise_for_status()
                  log.info("Phone notification sent.")
              except Exception as exc:
                  log.error("ntfy failed: %s", exc)
